# PR の検証。デプロイのワークフローと同じ検証を、マージの前に流す（デプロイはしない）。
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# 同じ PR に続けて push したら、古い実行は捨てる。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run check
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_GA_MEASUREMENT_ID: G-G0D34H905M
